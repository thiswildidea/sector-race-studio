<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 浏览器自动翻译会把界面文字改成英文，这里显式关掉 -->
<meta name="google" content="notranslate">
<title>行业板块竞速动画工作室</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#070b16; --panel:#0e1526; --line:rgba(120,150,210,.18);
    --txt:#e7eefc; --dim:#8296b8; --accent:#f59e0b;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);overflow:hidden;display:flex;
       font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif}

  #panel{width:352px;flex:none;height:100vh;overflow-y:auto;
         background:var(--panel);border-right:1px solid var(--line);padding:20px}
  #panel h1{font-size:17px;font-weight:600;margin-bottom:3px}
  #panel .sub{font-size:12px;color:var(--dim);margin-bottom:20px}

  .grp{margin-bottom:18px}
  .grp>label{display:block;font-size:12px;color:var(--dim);margin-bottom:8px;letter-spacing:.4px}

  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1 1 auto;min-width:54px;padding:7px 4px;font:inherit;font-size:12.5px;
    color:var(--dim);background:rgba(90,130,220,.10);border:1px solid var(--line);
    border-radius:8px;cursor:pointer;transition:.16s}
  .seg button:hover{background:rgba(110,160,255,.2);color:var(--txt)}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#231a04;font-weight:600}

  .row{display:flex;gap:8px;align-items:center}
  input[type=text],input[type=date]{flex:1;width:100%;padding:8px 10px;font:inherit;font-size:13px;
    color:var(--txt);background:rgba(90,130,220,.10);border:1px solid var(--line);border-radius:8px}
  input[type=text]::placeholder{color:#5d7199}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .val{font-size:12.5px;color:var(--txt);font-variant-numeric:tabular-nums}

  .pad{display:flex;gap:9px;align-items:center;margin-bottom:5px}
  .pad>span:first-child{width:13px;font-size:12px;color:var(--dim);flex:none}
  .pad .val{width:30px;text-align:right;flex:none}

  /* 自定义板块勾选网格 */
  #picker{display:none;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px;
    max-height:236px;overflow-y:auto;padding:9px;border:1px solid var(--line);border-radius:9px;
    background:rgba(90,130,220,.06)}
  #picker label{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim);cursor:pointer}
  #picker input{accent-color:var(--accent);width:13px;height:13px;flex:none}
  #picker label.on{color:var(--txt)}
  #pickCount{float:right;font-size:11.5px;color:var(--dim)}

  .mini{padding:8px 12px;font:inherit;font-size:12.5px;color:#ffe0a8;cursor:pointer;white-space:nowrap;
    background:rgba(245,158,11,.22);border:1px solid rgba(245,158,11,.45);border-radius:8px}
  .mini:hover{background:rgba(245,158,11,.4)}

  #searchWrap{position:relative;flex:1}
  #sugg{position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:50;display:none;
    max-height:250px;overflow-y:auto;background:#131c33;border:1px solid var(--line);
    border-radius:9px;box-shadow:0 12px 34px rgba(0,0,0,.6)}
  #sugg div{display:flex;align-items:center;gap:9px;padding:8px 11px;font-size:12.5px;
    cursor:pointer;border-bottom:1px solid rgba(120,150,210,.08)}
  #sugg div:last-child{border-bottom:none}
  #sugg div:hover,#sugg div.sel{background:rgba(245,158,11,.28)}
  #sugg b{color:var(--txt);font-weight:600}
  #sugg span{color:var(--dim);font-variant-numeric:tabular-nums}
  #sugg em{font-style:normal;margin-left:auto;font-size:11px;padding:1px 7px;border-radius:4px;
    background:rgba(245,158,11,.25);color:#fde68a}

  #picked{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .chip{display:flex;align-items:center;gap:5px;padding:4px 8px;font-size:12px;
    background:rgba(90,130,220,.12);border:1px solid var(--line);border-radius:999px;color:var(--dim)}
  .chip b{font-weight:600;color:var(--txt)}
  .chip i{font-style:normal;opacity:.5;padding-left:2px;cursor:pointer}
  .chip i:hover{opacity:1;color:#fca5a5}

  .chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);cursor:pointer;margin-top:9px}
  .chk input{accent-color:var(--accent);width:14px;height:14px}

  .act{display:flex;flex-direction:column;gap:9px;margin-top:20px}
  .act button{padding:11px;font:inherit;font-size:14px;font-weight:600;border-radius:10px;
    cursor:pointer;border:1px solid transparent;transition:.16s}
  #btnFetch{background:rgba(90,130,220,.16);border-color:var(--line);color:var(--txt)}
  #btnFetch:hover{background:rgba(110,160,255,.28)}
  #btnPreview{background:rgba(6,182,212,.16);border-color:rgba(6,182,212,.4);color:#7fe3f5}
  #btnPreview:hover{background:rgba(6,182,212,.3)}
  #btnExport{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff}
  #btnExport:hover{filter:brightness(1.12)}
  .act button:disabled{opacity:.4;cursor:not-allowed;filter:none}

  #status{margin-top:13px;padding:10px 12px;border-radius:9px;font-size:12px;line-height:1.65;
    background:rgba(90,130,220,.08);border:1px solid var(--line);color:var(--dim)}
  #status b{color:var(--txt);font-weight:600}
  #status.err{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:#fca5a5}
  #status.ok{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.36);color:#86efac}

  #bar{height:4px;background:rgba(120,150,210,.16);border-radius:3px;overflow:hidden;margin-top:11px;display:none}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f59e0b,#ef4444)}

  #stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;padding:18px}
  #wrap{position:relative}
  canvas{height:100%;width:100%;border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.6);display:block}
  #safe{position:absolute;inset:0;pointer-events:none;display:none}
  #safe div{position:absolute;border:1px dashed rgba(255,80,80,.55);border-radius:4px}
  #safe span{position:absolute;font-size:10px;color:rgba(255,120,120,.9);
    background:rgba(0,0,0,.5);padding:1px 5px;border-radius:3px}
  #recdot{position:absolute;top:14px;left:14px;display:none;align-items:center;gap:7px;
    background:rgba(0,0,0,.6);padding:5px 11px;border-radius:999px;font-size:12px;color:#fff}
  #recdot i{width:8px;height:8px;border-radius:50%;background:#ef4444;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
</style>
</head>
<body>

<div id="panel">
  <h1>行业板块竞速动画</h1>
  <div class="sub">抖音竖屏 · 板块轮动一眼看完 · 导出 MP4</div>

  <div class="grp">
    <label>竞速对象 <span id="pickCount"></span></label>
    <div class="seg" id="segList">
      <button data-list="l1" class="on">中证一级</button>
      <button data-list="theme">热门主题</button>
      <button data-list="custom">自定义板块</button>
      <button data-list="stocks">自选股</button>
    </div>
    <div id="picker"></div>
    <div id="stockBox" style="display:none">
      <div class="row" style="margin-top:9px">
        <div id="searchWrap">
          <input type="text" id="code" autocomplete="off" spellcheck="false"
                 placeholder="代码 / 名称 / 拼音，如 600519、茅台、maotai">
          <div id="sugg"></div>
        </div>
        <button class="mini" id="btnAdd">加入</button>
      </div>
      <div id="picked"></div>
    </div>
  </div>

  <div class="grp">
    <label>竞速指标</label>
    <div class="seg" id="segMetric">
      <button data-metric="ret" class="on">累计涨幅</button>
      <button data-metric="amt">累计成交额</button>
    </div>
  </div>

  <div class="grp">
    <label>数据区间</label>
    <div class="seg" id="segRange">
      <button data-m="1">近1月</button>
      <button data-m="3" class="on">近3月</button>
      <button data-m="6">近6月</button>
      <button data-m="12">近1年</button>
      <button data-m="0">自定义</button>
    </div>
    <div class="row" id="customRange" style="margin-top:9px;display:none">
      <input type="date" id="dStart"><span style="color:var(--dim);font-size:12px">至</span><input type="date" id="dEnd">
    </div>
  </div>

  <div class="grp">
    <label>视频时长 <span class="val" id="vDur">60 秒</span></label>
    <input type="range" id="rDur" min="10" max="180" step="5" value="60">
  </div>

  <div class="grp">
    <label>分辨率（竖屏 9:16）</label>
    <div class="seg" id="segRes">
      <button data-w="720"  data-h="1280">720p</button>
      <button data-w="1080" data-h="1920" class="on">1080p</button>
      <button data-w="1440" data-h="2560">1440p</button>
    </div>
  </div>

  <div class="grp">
    <label>帧率</label>
    <div class="seg" id="segFps">
      <button data-fps="30" class="on">30 fps</button>
      <button data-fps="60">60 fps</button>
    </div>
  </div>

  <div class="grp">
    <label>清晰度</label>
    <div class="seg" id="segQ">
      <button data-q="6">标准</button>
      <button data-q="10" class="on">高清</button>
      <button data-q="16">超清</button>
    </div>
    <label class="chk"><input type="checkbox" id="cbSafe">显示抖音安全区参考线（不会录进视频）</label>
    <label class="chk"><input type="checkbox" id="cbNoTitle">隐藏标题（下方内容整体上移）</label>
  </div>

  <div class="grp">
    <label>标题文字</label>
    <input type="text" id="tTitle" autocomplete="off" spellcheck="false"
           placeholder="留空则自动生成" maxlength="24">
  </div>

  <div class="grp">
    <label>图表边距（1080×1920 基准像素）</label>
    <div class="pad"><span>左</span><input type="range" id="rPadL" min="20" max="200" step="2" value="50"><span class="val" id="vPadL">50</span></div>
    <div class="pad"><span>右</span><input type="range" id="rPadR" min="20" max="200" step="2" value="50"><span class="val" id="vPadR">50</span></div>
    <div class="pad"><span>下</span><input type="range" id="rPadB" min="150" max="420" step="5" value="250"><span class="val" id="vPadB">250</span></div>
  </div>

  <div class="act">
    <button id="btnFetch">① 获取数据</button>
    <button id="btnPreview" disabled>② 预览播放</button>
    <button id="btnExport" disabled>③ 导出 MP4</button>
  </div>

  <div id="status">选好板块后点「获取数据」。</div>
  <div id="bar"><i></i></div>
</div>

<div id="stage">
  <div id="wrap">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div id="safe"></div>
    <div id="recdot"><i></i><span id="recTxt">录制中</span></div>
  </div>
</div>

<script>
'use strict';

/* ==================== 板块清单 ====================
   代码全部实测可用：快照与日线都能取到。中证一级行业这一套互斥且穷尽，
   适合讲「全市场板块轮动」；热门主题辨识度高，适合讲具体赛道。 */
const LIST_L1 = [
  { code:'sh000928', name:'能源'     },
  { code:'sh000929', name:'材料'     },
  { code:'sh000930', name:'工业'     },
  { code:'sh000931', name:'可选消费' },
  { code:'sh000932', name:'主要消费' },
  { code:'sh000933', name:'医药卫生' },
  { code:'sh000934', name:'金融'     },
  { code:'sh000935', name:'信息技术' },
  { code:'sh000936', name:'通信'     },
  { code:'sh000937', name:'公用事业' },
];
const LIST_THEME = [
  { code:'sz399997', name:'白酒'   },
  { code:'sz399975', name:'证券'   },
  { code:'sz399986', name:'银行'   },
  { code:'sz399989', name:'医疗'   },
  { code:'sz399967', name:'军工'   },
  { code:'sz399971', name:'传媒'   },
  { code:'sz399808', name:'新能源' },
  { code:'sz399976', name:'新能源车' },
  { code:'sh000827', name:'环保'   },
  { code:'sh000922', name:'红利'   },
  { code:'sz399998', name:'煤炭'   },
  { code:'sh000819', name:'有色金属' },
  { code:'sz399995', name:'基建'   },
  { code:'sh000949', name:'农业'   },
  { code:'sz399996', name:'智能家居' },
];
// 自定义勾选的候选池 = 两套清单去重后的并集
const ALL_SECTORS = (() => {
  const seen = new Set(), out = [];
  for (const it of LIST_L1.concat(LIST_THEME)){
    if (seen.has(it.code)) continue;
    seen.add(it.code); out.push(it);
  }
  return out;
})();

const MAX_ROWS = 16;   // 再多竖屏就挤成条形码了
const MIN_ROWS = 3;

/* ==================== 状态 ==================== */
const cfg = { list:'l1', custom:[], stocks:[], metric:'ret', months:3, start:'', end:'',
              dur:60, w:1080, h:1920, fps:30, mbps:10,
              padL:50, padR:50, padB:250, hideTitle:false, title:'' };

const API = 'https://proxy.finance.qq.com/ifzqgtimg/appstock/app/newfqkline/get';
const MIME = 'video/mp4;codecs=avc1.640028';
const MARKET_CLOSE_MIN = 15 * 60 + 5;   // A股 15:00 收盘，留 5 分钟结算

let DATA = null;   // {list, dates, ret, amt}
let anim = null;
let playing = false, exporting = false, elapsed = 0, lastTs = null;
let lastFrameT = 0;   // 画面上正停着的那一帧，调参数时按它重画

/* ==================== 工具 ==================== */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const lerp = (a,b,t) => a + (b-a)*t;
const smoothstep = t => t*t*(3-2*t);
const easeOutCubic = x => 1 - Math.pow(1-x,3);
const pad2 = n => String(n).padStart(2,'0');
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s);

function fmtNum(v, dec){
  return v.toLocaleString('en-US', { minimumFractionDigits:dec, maximumFractionDigits:dec });
}
function setStatus(html, kind){ const el=$('status'); el.className = kind||''; el.innerHTML = html; }
function showBar(on, p){ $('bar').style.display = on?'block':'none'; $('bar').firstElementChild.style.width = ((p||0)*100).toFixed(1)+'%'; }
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

/** 收盘前的当日K线只有集合竞价量，必须剔除 */
function isTodayIncomplete(day){
  if (day !== todayISO()) return false;
  const now = new Date();
  return now.getHours()*60 + now.getMinutes() < MARKET_CLOSE_MIN;
}

function jsonp(url){
  return new Promise((resolve, reject) => {
    const cb = '__jp' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('请求超时')); }, 15000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); resolve(d); };
    s.onerror = () => { cleanup(); reject(new Error('网络请求失败')); };
    s.src = url + '&_callback=' + cb;
    document.head.appendChild(s);
  });
}

/* 每个板块一个固定颜色，观众可以靠颜色追踪某一条 */
const PALETTE = [
  [239,68,68],  [245,158,11], [234,179,8],  [132,204,22],
  [34,197,94],  [20,184,166], [6,182,212],  [59,130,246],
  [99,102,241], [139,92,246], [168,85,247], [217,70,239],
  [236,72,153], [244,114,182],[251,146,60], [148,163,184],
];
const rgba = (c,a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* ==================== 清单选择 ==================== */
function currentList(){
  if (cfg.list === 'l1') return LIST_L1;
  if (cfg.list === 'theme') return LIST_THEME;
  if (cfg.list === 'stocks') return cfg.stocks;
  return ALL_SECTORS.filter(s => cfg.custom.includes(s.code));
}
function listLabel(){
  return cfg.list === 'l1' ? '中证一级行业'
       : cfg.list === 'theme' ? '热门主题板块'
       : cfg.list === 'stocks' ? '自选股' : '自选板块';
}
const unitWord = () => cfg.list === 'stocks' ? '只个股' : '个板块';

function renderPicker(){
  const box = $('picker');
  box.innerHTML = '';
  ALL_SECTORS.forEach(s => {
    const on = cfg.custom.includes(s.code);
    const lab = document.createElement('label');
    lab.className = on ? 'on' : '';
    lab.innerHTML = `<input type="checkbox" ${on?'checked':''}><span>${s.name}</span>`;
    lab.querySelector('input').addEventListener('change', e => {
      if (e.target.checked){ if (!cfg.custom.includes(s.code)) cfg.custom.push(s.code); }
      else cfg.custom = cfg.custom.filter(c => c !== s.code);
      lab.className = e.target.checked ? 'on' : '';
      updateCount();
    });
    box.appendChild(lab);
  });
}
function updateCount(){
  const n = currentList().length;
  const warn = n < MIN_ROWS || n > MAX_ROWS;
  $('pickCount').innerHTML = warn
    ? `<span style="color:#fca5a5">已选 ${n} 个（需 ${MIN_ROWS}–${MAX_ROWS}）</span>`
    : `已选 ${n} 个`;
}

/* ==================== 自选股检索 ==================== */
const SEARCH_API = 'https://smartbox.gtimg.cn/s3/';
const MARKET_LABEL = { sh:'沪', sz:'深', bj:'京', hk:'港', us:'美' };
const STOCK_KEY = 'sectorRaceStudio.stocks';
const SH3 = ['600','601','603','605','688','689','900'];
const SZ3 = ['000','001','002','003','300','301','200'];

function normalizeCode(raw){
  const s = String(raw).trim().toLowerCase().replace(/\s+/g,'');
  if (/^(sh|sz|bj|hk|us)/.test(s)) return s;
  if (/^\d{6}$/.test(s)){
    const p3 = s.slice(0,3);
    if (SH3.includes(p3)) return 'sh' + s;
    if (SZ3.includes(p3)) return 'sz' + s;
    const p1 = s.slice(0,1);
    if (p1 === '6') return 'sh' + s;
    if (p1 === '0' || p1 === '3') return 'sz' + s;
    return 'bj' + s;
  }
  if (/^\d{5}$/.test(s)) return 'hk' + s;
  if (/^[a-z.]{1,6}$/.test(s)) return 'us' + s.toUpperCase();
  return '';
}

/**
 * 腾讯 smartbox 检索。两个坑：响应体是 GBK 但响应头谎称 utf-8，必须显式给
 * script 指定 charset；且没有 CORS 头，fetch 会被拦，只能用 script 标签。
 */
function searchStock(q){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.charset = 'GBK';
    const timer = setTimeout(() => { cleanup(); reject(new Error('搜索超时')); }, 8000);
    function cleanup(){ clearTimeout(timer); s.remove(); }
    window.v_hint = '';
    s.onload = () => {
      const raw = String(window.v_hint || '');
      cleanup();
      if (!raw || raw === 'N') return resolve([]);
      resolve(raw.split('^').map(it => {
        const f = it.split('~');
        return { market:f[0], num:f[1], name:f[2], type:f[4], code:(f[0]||'')+(f[1]||'') };
      }).filter(r => r.num && r.name));
    };
    s.onerror = () => { cleanup(); reject(new Error('搜索请求失败')); };
    s.src = SEARCH_API + '?v=2&t=all&q=' + encodeURIComponent(q);
    document.head.appendChild(s);
  });
}

let searchTimer = null, suggItems = [], suggIdx = -1;
function hideSugg(){ $('sugg').style.display = 'none'; suggIdx = -1; }

function renderSugg(list){
  const box = $('sugg');
  box.innerHTML = ''; suggItems = list; suggIdx = -1;
  if (!list.length){ hideSugg(); return; }
  list.forEach((r, i) => {
    const d = document.createElement('div');
    const b = document.createElement('b');     b.textContent = r.name;
    const sp = document.createElement('span'); sp.textContent = r.num;
    const em = document.createElement('em');
    em.textContent = (MARKET_LABEL[r.market] || r.market) + (r.type === 'ZS' ? ' 指数' : '');
    d.append(b, sp, em);
    d.onmousedown = e => { e.preventDefault(); addStock(r.code, r.name); };
    box.appendChild(d);
  });
  box.style.display = 'block';
}

// 接口返回的名称里可能带空格（如「五 粮 液」），会把画面上的名字撑开撞到数值
const cleanName = s => String(s || '').replace(/\s+/g, '');

function addStock(code, name){
  code = normalizeCode(code);
  name = cleanName(name);
  if (!code){ setStatus('代码格式无法识别', 'err'); return; }
  if (cfg.stocks.some(s => s.code === code)) { $('code').value = ''; hideSugg(); return; }
  if (cfg.stocks.length >= MAX_ROWS){ setStatus(`最多 ${MAX_ROWS} 只`, 'err'); return; }
  // 名称留空时先用代码占位，取到日线后会用接口返回的名称覆盖
  cfg.stocks.push({ code, name: name || code.toUpperCase() });
  localStorage.setItem(STOCK_KEY, JSON.stringify(cfg.stocks));
  $('code').value = ''; hideSugg();
  renderPicked(); updateCount();
}

function renderPicked(){
  const box = $('picked');
  box.innerHTML = '';
  cfg.stocks.forEach(s => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    const b = document.createElement('b'); b.textContent = s.name;
    const x = document.createElement('i');  x.textContent = '×';
    x.onclick = () => {
      cfg.stocks = cfg.stocks.filter(v => v.code !== s.code);
      localStorage.setItem(STOCK_KEY, JSON.stringify(cfg.stocks));
      renderPicked(); updateCount();
    };
    chip.append(b, x);
    box.appendChild(chip);
  });
}

/* ==================== 取数 ==================== */
function resolveRange(){
  const end = cfg.months === 0 ? cfg.end : todayISO();
  let start;
  if (cfg.months === 0) start = cfg.start;
  else { const d = new Date(); d.setMonth(d.getMonth()-cfg.months);
         start = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
  if (!isDate(start) || !isDate(end)) throw new Error('请填写合法的起止日期');
  if (start >= end) throw new Error('起始日期必须早于结束日期');
  const days = Math.round((new Date(end) - new Date(start)) / 86400000);
  if (days > 640) throw new Error('区间过长，单次最多约 640 个自然日，请缩短');
  return { start, end, days };
}

async function loadData(){
  const list = currentList();
  if (list.length < MIN_ROWS) throw new Error(`至少选 ${MIN_ROWS} ${unitWord()}才能竞速`);
  if (list.length > MAX_ROWS) throw new Error(`最多 ${MAX_ROWS} ${unitWord()}，再多竖屏放不下`);
  const { start, end, days } = resolveRange();

  // 每个板块单独拉一次日线。串行是为了不把接口打崩，十几个请求几秒就完。
  const raw = [];
  for (let i = 0; i < list.length; i++){
    const it = list[i];
    setStatus(`正在获取 <b>${it.name}</b> … (${i+1}/${list.length})`);
    const param = encodeURIComponent(`${it.code},day,${start},${end},${clamp(days,5,640)},qfq`);
    const res = await jsonp(`${API}?param=${param}`);
    if (!res || res.code !== 0) throw new Error(`${it.name} 接口异常：${res && res.msg}`);
    const node = res.data[it.code];
    const bars = node && (node.qfqday || node.day);
    if (!bars || !bars.length) throw new Error(`${it.name} 在该区间内无数据`);

    const m = new Map();
    for (const b of bars){
      // 条数参数优先级高于起始日期，接口可能往前多给，这里按日期再过滤一次
      if (b[0] < start || b[0] > end || isTodayIncomplete(b[0])) continue;
      const close = parseFloat(b[2]);
      const amtYi = parseFloat(b[8]) / 10000;    // 接口给的是万元
      if (close > 0) m.set(b[0], { close, amt: amtYi > 0 ? amtYi : 0 });
    }
    // 自选股是用户敲进来的，名称以接口返回的为准
    const nm = cleanName(node.qt && node.qt[it.code] && node.qt[it.code][1]);
    raw.push({ ...it, name: nm || it.name, m });
  }
  if (cfg.list === 'stocks'){
    raw.forEach(s => { const t = cfg.stocks.find(x => x.code === s.code); if (t) t.name = s.name; });
    localStorage.setItem(STOCK_KEY, JSON.stringify(cfg.stocks));
    renderPicked();
  }

  // 只保留所有板块都有数据的交易日，避免某个板块缺一天就让名次凭空跳动
  let dates = [...raw[0].m.keys()];
  for (const s of raw) dates = dates.filter(d => s.m.has(d));
  dates.sort();
  if (dates.length < 5) throw new Error('各板块共有的交易日不足 5 天');

  const ret = raw.map(s => {
    const base = s.m.get(dates[0]).close;
    return dates.map(d => (s.m.get(d).close / base - 1) * 100);
  });
  const amt = raw.map(s => {
    let acc = 0;
    return dates.map(d => (acc += s.m.get(d).amt));
  });

  DATA = { list: raw.map(s => ({ code:s.code, name:s.name })), dates, ret, amt };
  return DATA;
}

/* ==================== 动画参数 ==================== */
function buildAnim(){
  const N = DATA.dates.length, K = DATA.list.length;
  const vals = cfg.metric === 'ret' ? DATA.ret : DATA.amt;

  // 逐日名次。名次本身参与插值，条形交叉才是平滑的，而不是整行瞬间跳一格。
  const rank = Array.from({ length:K }, () => new Array(N));
  const idx = [...Array(K).keys()];
  for (let i = 0; i < N; i++){
    const order = idx.slice().sort((a,b) => vals[b][i] - vals[a][i]);
    order.forEach((k, pos) => { rank[k][i] = pos; });
  }

  // 坐标轴范围也逐日算并插值，否则每跨一天整排条形会突然伸缩。
  // 两端各留出一截空白：数值标签画在条形末端外侧，不留的话最长的那根会把
  // 标签顶进左边的板块名里。
  const axMin = [], axMax = [];
  for (let i = 0; i < N; i++){
    let mn = Infinity, mx = -Infinity;
    for (let k = 0; k < K; k++){ mn = Math.min(mn, vals[k][i]); mx = Math.max(mx, vals[k][i]); }
    const lo = Math.min(mn, 0), hi = Math.max(mx, 0);
    const span = (hi - lo) || 1;
    axMin.push(lo < 0 ? lo - span*0.22 : lo);
    axMax.push(hi > 0 ? hi + span*0.16 : hi);
  }

  const TOTAL = cfg.dur * 1000;
  const intro = Math.min(2200, TOTAL*0.05);
  const finale = clamp(TOTAL*0.12, 2500, 8000);
  anim = { N, K, vals, rank, axMin, axMax, TOTAL, intro, finale,
           raceSpan: Math.max(1, TOTAL - intro - finale),
           tFinale: TOTAL - finale,
           unit: cfg.metric === 'ret' ? '%' : '亿',
           dec:  cfg.metric === 'ret' ? 2 : 0 };
}

/** 某一时刻的完整画面状态：每个板块的值、名次、以及坐标轴范围 */
function stateAt(t){
  const p = clamp((t - anim.intro) / anim.raceSpan, 0, 1);
  const pos = p * (anim.N - 1);
  const i0 = Math.max(0, Math.min(anim.N - 2, Math.floor(pos)));
  const i1 = Math.min(anim.N - 1, i0 + 1);
  const f = anim.N > 1 ? clamp(pos - i0, 0, 1) : 0;
  const fe = smoothstep(f);

  const rows = [];
  for (let k = 0; k < anim.K; k++){
    rows.push({
      k,
      value: lerp(anim.vals[k][i0], anim.vals[k][i1], f),
      slot:  lerp(anim.rank[k][i0], anim.rank[k][i1], fe),
      final: anim.rank[k][anim.N-1],
    });
  }
  return {
    rows,
    date: DATA.dates[Math.round(pos)],
    axMin: lerp(anim.axMin[i0], anim.axMin[i1], f),
    axMax: lerp(anim.axMax[i0], anim.axMax[i1], f),
  };
}

/* ==================== 渲染 ==================== */
const cv = $('cv'), ctx = cv.getContext('2d');

function fitPreview(){
  const stage = $('stage'), wrap = $('wrap');
  const availW = stage.clientWidth - 36, availH = stage.clientHeight - 36;
  if (availW <= 0 || availH <= 0) return;
  const ar = cv.width / cv.height;
  let w = availH * ar, h = availH;
  if (w > availW){ w = availW; h = availW / ar; }
  wrap.style.width = w + 'px';
  wrap.style.height = h + 'px';
}
window.addEventListener('resize', fitPreview);

const S = () => cv.height/1920;
const F = (px,w) => `${w||''} ${Math.round(px*S())}px "Microsoft YaHei",sans-serif`.trim();

const GUTTER_L = 150;   // 左侧板块名占位
const GUTTER_R = 130;   // 右侧数值占位

/* 下边距量的是最靠下的内容（数据来源署名）到底边的距离 */
const FOOTER_Y = () => cv.height - cfg.padB*S();
/* 隐藏标题时下方内容整体上移一行 */
const HEAD_UP = () => cfg.hideTitle ? cv.height*0.047 : 0;

function layout(){
  const W = cv.width, H = cv.height, s = S();
  const x0 = cfg.padL*s + GUTTER_L*s;
  const x1 = W - cfg.padR*s - GUTTER_R*s;
  const y0 = H*0.278 - HEAD_UP();
  const y1 = FOOTER_Y() - 74*s;
  return { W, H, s, x0, x1, plotW: x1-x0, y0, y1, rowH: (y1-y0)/Math.max(1, anim.K) };
}

function drawBg(){
  const g = ctx.createLinearGradient(0,0,0,cv.height);
  g.addColorStop(0,'#0f1226'); g.addColorStop(.5,'#090e1d'); g.addColorStop(1,'#070914');
  ctx.fillStyle = g; ctx.fillRect(0,0,cv.width,cv.height);
}

/** 自定义标题可能很长，超出可用宽度时按比例缩字号 */
function fitPx(text, px, maxW, weight){
  ctx.font = F(px, weight);
  const w = ctx.measureText(text).width;
  return w <= maxW ? px : Math.max(px*0.5, px*maxW/w);
}

/** 把几段不同颜色的文字拼成一行整体居中画出来 */
function drawSegments(segs, cx, y, px){
  let total = 0;
  for (const s of segs){ ctx.font = F(px, s.weight); total += ctx.measureText(s.text).width; }
  ctx.save(); ctx.textAlign = 'left';
  let x = cx - total/2;
  for (const s of segs){
    ctx.font = F(px, s.weight); ctx.fillStyle = s.color;
    ctx.fillText(s.text, x, y);
    x += ctx.measureText(s.text).width;
  }
  ctx.restore();
}

function autoTitle(){
  return cfg.metric === 'ret' ? `${listLabel()}涨幅竞速` : `${listLabel()}成交额竞速`;
}

function drawHeader(t, st){
  const W = cv.width, H = cv.height, s = S();
  const a = clamp(t/1000, 0, 1);
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center';

  // 标题整体压到 12% 的顶部安全区之下，手机状态栏和播放器控件才不会盖住
  const up = HEAD_UP();
  if (!cfg.hideTitle){
    const title = cfg.title.trim() || autoTitle();
    ctx.fillStyle = '#f2f6ff'; ctx.font = F(fitPx(title, 64, W - 120*s, '700'), '700');
    ctx.fillText(title, W/2, H*0.155);
  }

  drawSegments([
    { text: `${DATA.dates[0]} 至 ${DATA.dates[anim.N-1]} · `, color:'#8296b8' },
    { text: String(anim.N), color:'#ff6b6b', weight:'700' },
    { text: ` 个交易日 · ${anim.K} ${unitWord()}`, color:'#8296b8' },
  ], W/2, H*0.188 - up, 26);

  ctx.fillStyle = '#fbbf24'; ctx.font = F(40,'600');
  ctx.fillText(st.date, W/2, H*0.222 - up);
  ctx.restore();
}

/** 零轴与纵向刻度线 */
function drawAxis(t, st){
  const { s, x0, x1, plotW, y0, y1 } = layout();
  const a = clamp((t-400)/1200, 0, 1);
  if (a <= 0) return;
  const span = (st.axMax - st.axMin) || 1;
  const zx = x0 + (0 - st.axMin)/span * plotW;

  ctx.save(); ctx.globalAlpha = a;
  ctx.strokeStyle = 'rgba(120,150,200,.22)'; ctx.lineWidth = Math.max(1, 2*s);
  ctx.beginPath(); ctx.moveTo(zx, y0 - 10*s); ctx.lineTo(zx, y1 + 10*s); ctx.stroke();
  ctx.restore();
  return zx;
}

function drawRows(t, st){
  const { s, x0, x1, plotW, y0, rowH } = layout();
  const span = (st.axMax - st.axMin) || 1;
  const zx = x0 + (0 - st.axMin)/span * plotW;
  const barH = Math.min(rowH*0.64, 96*s);
  const nameFont = Math.min(30, rowH/s*0.34);
  const valFont  = Math.min(30, rowH/s*0.34);

  // 名次靠后的先画，万一重叠时领先者压在上面
  const order = st.rows.slice().sort((a,b) => b.slot - a.slot);
  for (const r of order){
    const intro = clamp((t - 300 - r.k*60)/700, 0, 1);
    if (intro <= 0) continue;
    const c = PALETTE[r.k % PALETTE.length];
    const yc = y0 + (r.slot + 0.5)*rowH;
    const vx = x0 + (r.value - st.axMin)/span * plotW;
    const left = Math.min(zx, vx), right = Math.max(zx, vx);
    const w = Math.max(3*s, (right-left) * easeOutCubic(intro));
    const bx = vx >= zx ? zx : zx - w;

    ctx.save(); ctx.globalAlpha = intro;

    // 收尾阶段给第一名加辉光，成片最后一帧有个落点
    const champion = t > anim.tFinale && r.final === 0;
    if (champion){ ctx.shadowColor = rgba(c,.85); ctx.shadowBlur = 26*s; }

    const g = ctx.createLinearGradient(bx, 0, bx+w, 0);
    g.addColorStop(0, rgba(c,.55)); g.addColorStop(1, rgba(c,.98));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(bx, yc-barH/2, w, barH, 6*s); ctx.fill();
    ctx.shadowBlur = 0;

    // 板块名固定在左侧留白里，右对齐贴着坐标区
    ctx.fillStyle = champion ? '#ffffff' : '#c9d8f5';
    ctx.font = F(nameFont, champion ? '700' : '600');
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(DATA.list[r.k].name, x0 - 14*s, yc);

    // 数值默认跟在条形末端外侧；条形够长时改画在内侧，否则最长的那根会把标签
    // 顶出坐标区、压到左边的名字上（轴留白是按数值比例算的，挡不住固定宽度的标签）
    const txt = (cfg.metric === 'ret' && r.value > 0 ? '+' : '') + fmtNum(r.value, anim.dec) + anim.unit;
    ctx.font = F(valFont, '700');
    const inside = w >= ctx.measureText(txt).width + 26*s;
    ctx.fillStyle = inside ? '#ffffff'
      : cfg.metric === 'ret' ? (r.value >= 0 ? '#ff6b6b' : '#4ade80') : rgba(c,1);
    if (vx >= zx){
      ctx.textAlign = inside ? 'right' : 'left';
      ctx.fillText(txt, inside ? bx + w - 13*s : bx + w + 12*s, yc);
    } else {
      ctx.textAlign = inside ? 'left' : 'right';
      ctx.fillText(txt, inside ? bx + 13*s : bx - 12*s, yc);
    }

    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }
}

function drawFooter(t){
  const W = cv.width;
  const a = clamp((t - anim.tFinale + 1200)/900, 0, 1);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a*0.8;
  ctx.fillStyle = '#5b6f92'; ctx.font = F(20); ctx.textAlign = 'center';
  ctx.fillText('数据来源：腾讯财经行情接口 · 仅供参考，不构成投资建议', W/2, FOOTER_Y());
  ctx.restore();
}

function drawProgress(t){
  const W = cv.width, H = cv.height;
  const p = clamp(t/anim.TOTAL, 0, 1), hh = Math.max(4, H*0.003);
  ctx.fillStyle = 'rgba(120,150,210,.14)'; ctx.fillRect(0,H-hh,W,hh);
  const g = ctx.createLinearGradient(0,0,W,0);
  g.addColorStop(0,'#f59e0b'); g.addColorStop(1,'#ef4444');
  ctx.fillStyle = g; ctx.fillRect(0,H-hh,W*p,hh);
}

function renderFrame(t){
  lastFrameT = t;
  drawBg();
  if (!anim || !DATA) return;
  const st = stateAt(t);
  drawAxis(t, st);
  drawRows(t, st);
  drawFooter(t);
  drawHeader(t, st);
  drawProgress(t);
}

function drawIntro(){
  drawBg();
  const W = cv.width, H = cv.height;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e7eefc'; ctx.font = F(58,'700');
  ctx.fillText('行业板块竞速', W/2, H*0.44);
  ctx.fillStyle = '#7e94b8'; ctx.font = F(26);
  ctx.fillText('← 选好板块后点「获取数据」', W/2, H*0.50);
}

/* ==================== 播放循环 ==================== */
function loop(now){
  if (lastTs === null) lastTs = now;
  const dt = now - lastTs; lastTs = now;
  if (playing && anim){
    elapsed = Math.min(elapsed + dt, anim.TOTAL);
    renderFrame(elapsed);
    if (exporting){
      showBar(true, elapsed/anim.TOTAL);
      $('recTxt').textContent = `录制中 ${(elapsed/1000).toFixed(0)}s / ${cfg.dur}s`;
    }
    if (elapsed >= anim.TOTAL) playing = false;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ==================== MP4 导出 ==================== */
async function exportMp4(){
  if (!MediaRecorder.isTypeSupported(MIME)){
    setStatus('当前浏览器不支持 MP4 录制，请用 Chrome 或 Edge 最新版打开。','err');
    return;
  }
  exporting = true; setControls(false);
  $('recdot').style.display = 'flex';
  $('safe').style.display = 'none';

  const scale = (cfg.w*cfg.h)/(1080*1920) * (cfg.fps/30);
  const stream = cv.captureStream(cfg.fps);
  const rec = new MediaRecorder(stream, { mimeType: MIME, videoBitsPerSecond: Math.round(cfg.mbps*1e6*scale) });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  const stopped = new Promise(res => { rec.onstop = res; });

  elapsed = 0; lastTs = null; playing = true;
  rec.start(1000);
  await new Promise(res => { const iv = setInterval(() => { if (!playing){ clearInterval(iv); res(); } }, 60); });

  renderFrame(anim.TOTAL);
  await new Promise(r => setTimeout(r, 350));
  rec.stop(); await stopped;
  stream.getTracks().forEach(tr => tr.stop());

  const blob = new Blob(chunks, { type:'video/mp4' });
  const metric = cfg.metric === 'ret' ? '涨幅' : '成交额';
  const name = `板块竞速_${listLabel()}_${metric}_${DATA.dates[0]}_${DATA.dates[anim.N-1]}_${cfg.w}x${cfg.h}.mp4`;
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();

  const probe = await inspectVideo(url);
  setTimeout(() => URL.revokeObjectURL(url), 60000);

  exporting = false;
  $('recdot').style.display = 'none'; showBar(false);
  $('safe').style.display = $('cbSafe').checked ? 'block' : 'none';
  setControls(true);
  setStatus(`导出完成 · <b>${(blob.size/1048576).toFixed(1)} MB</b><br>
             实测 <b>${probe.w}×${probe.h}</b> · 时长 <b>${probe.dur}</b> 秒<br>
             已保存到浏览器下载目录。`, 'ok');
}

function inspectVideo(url){
  return new Promise(resolve => {
    const v = document.createElement('video');
    v.preload='metadata'; v.muted=true; v.src=url;
    const done = () => resolve({ w:v.videoWidth, h:v.videoHeight,
                                 dur: Number.isFinite(v.duration) ? v.duration.toFixed(1) : '未知' });
    v.onloadedmetadata = () => {
      if (Number.isFinite(v.duration)) return done();
      v.currentTime = 1e6;
      v.ontimeupdate = () => { v.ontimeupdate = null; done(); };
      setTimeout(done, 1500);
    };
    v.onerror = () => resolve({ w:0, h:0, dur:'解析失败' });
  });
}

/* ==================== 控件 ==================== */
function setControls(on){
  ['btnFetch','btnPreview','btnExport'].forEach(id => { $(id).disabled = !on; });
  if (on && !DATA){ $('btnPreview').disabled = true; $('btnExport').disabled = true; }
}

function bindSeg(id, fn){
  const box = $(id);
  box.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    [...box.children].forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    fn(b);
  });
}

bindSeg('segList', b => {
  cfg.list = b.dataset.list;
  $('picker').style.display   = cfg.list === 'custom' ? 'grid' : 'none';
  $('stockBox').style.display = cfg.list === 'stocks' ? 'block' : 'none';
  updateCount();
});

$('code').addEventListener('input', () => {
  const q = $('code').value.trim();
  clearTimeout(searchTimer);
  if (!q){ hideSugg(); return; }
  searchTimer = setTimeout(async () => {
    try { renderSugg((await searchStock(q)).slice(0, 8)); } catch (e){ hideSugg(); }
  }, 220);
});
$('code').addEventListener('keydown', e => {
  const n = suggItems.length;
  if (e.key === 'Escape'){ hideSugg(); return; }
  if (e.key === 'Enter'){
    e.preventDefault();
    if (suggIdx >= 0 && suggItems[suggIdx]) addStock(suggItems[suggIdx].code, suggItems[suggIdx].name);
    else addStock($('code').value, '');
    return;
  }
  if (!n || $('sugg').style.display === 'none') return;
  if (e.key === 'ArrowDown'){ e.preventDefault(); suggIdx = (suggIdx+1) % n; }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); suggIdx = (suggIdx-1+n) % n; }
  else return;
  [...$('sugg').children].forEach((c,i) => c.classList.toggle('sel', i === suggIdx));
});
$('code').addEventListener('blur', () => setTimeout(hideSugg, 120));
$('btnAdd').addEventListener('click', () => addStock($('code').value, ''));
bindSeg('segMetric', b => {
  cfg.metric = b.dataset.metric;
  if (DATA){ buildAnim(); renderFrame(lastFrameT); }
});
bindSeg('segRange', b => {
  cfg.months = parseInt(b.dataset.m, 10);
  $('customRange').style.display = cfg.months === 0 ? 'flex' : 'none';
});
bindSeg('segRes', b => {
  cfg.w = parseInt(b.dataset.w,10); cfg.h = parseInt(b.dataset.h,10);
  cv.width = cfg.w; cv.height = cfg.h;
  fitPreview();
  if (anim) renderFrame(lastFrameT); else drawIntro();
});
bindSeg('segFps', b => { cfg.fps = parseInt(b.dataset.fps,10); });
bindSeg('segQ',   b => { cfg.mbps = parseInt(b.dataset.q,10); });

$('rDur').addEventListener('input', e => {
  cfg.dur = parseInt(e.target.value,10);
  $('vDur').textContent = cfg.dur + ' 秒';
  if (DATA){ buildAnim(); elapsed = 0; renderFrame(anim.TOTAL); }
});

[['rPadL','vPadL','padL'], ['rPadR','vPadR','padR'], ['rPadB','vPadB','padB']].forEach(([slider,out,key]) => {
  $(slider).addEventListener('input', e => {
    cfg[key] = parseInt(e.target.value,10);
    $(out).textContent = cfg[key];
    if (anim) renderFrame(lastFrameT);
  });
});

$('dStart').addEventListener('change', e => { cfg.start = e.target.value; });
$('dEnd').addEventListener('change', e => { cfg.end = e.target.value; });
$('cbSafe').addEventListener('change', e => { $('safe').style.display = e.target.checked?'block':'none'; });
$('cbNoTitle').addEventListener('change', e => {
  cfg.hideTitle = e.target.checked;
  $('tTitle').disabled = cfg.hideTitle;
  if (anim) renderFrame(lastFrameT);
});
$('tTitle').addEventListener('input', e => {
  cfg.title = e.target.value;
  if (anim) renderFrame(lastFrameT);
});

$('btnFetch').addEventListener('click', async () => {
  setControls(false);
  try {
    await loadData();
    buildAnim();
    elapsed = 0; playing = false;
    renderFrame(anim.TOTAL);          // 先把成片最后一帧定格给用户看
    $('btnPreview').disabled = false; $('btnExport').disabled = false;
    $('tTitle').placeholder = `留空则用「${autoTitle()}」`;

    const vals = cfg.metric === 'ret' ? DATA.ret : DATA.amt;
    const last = vals.map((v,k) => ({ name: DATA.list[k].name, v: v[v.length-1] }))
                     .sort((a,b) => b.v - a.v);
    const u = anim.unit, d = anim.dec;
    setStatus(`<b>${listLabel()}</b> · ${anim.K} ${unitWord()} · ${anim.N} 个交易日<br>
               冠军 <b>${last[0].name}</b> ${fmtNum(last[0].v,d)}${u} ·
               垫底 <b>${last[last.length-1].name}</b> ${fmtNum(last[last.length-1].v,d)}${u}`, 'ok');
  } catch (err){
    setStatus('获取失败：' + err.message, 'err');
  } finally {
    $('btnFetch').disabled = false;
  }
});

$('btnPreview').addEventListener('click', () => { if (anim){ elapsed=0; lastTs=null; playing=true; } });
$('btnExport').addEventListener('click', () => {
  exportMp4().catch(e => {
    exporting=false; setControls(true);
    $('recdot').style.display='none'; showBar(false);
    setStatus('导出失败：'+e.message, 'err');
  });
});

/* 抖音安全区参考线 */
(function(){
  const zones = [
    ['top:0;left:0;right:0;height:12%','顶部信息区','top:4px;left:6px'],
    ['top:38%;right:0;width:18%;height:47%','右侧按钮','top:38%;right:6px'],
    ['bottom:0;left:0;right:0;height:22%','底部文案区','bottom:4px;left:6px'],
  ];
  zones.forEach(([css,label,lpos]) => {
    const d=document.createElement('div'); d.style.cssText=css; $('safe').appendChild(d);
    const s=document.createElement('span'); s.textContent=label; s.style.cssText=lpos; $('safe').appendChild(s);
  });
})();

/* 初始画面 */
cfg.custom = LIST_L1.map(s => s.code);
try { cfg.stocks = JSON.parse(localStorage.getItem(STOCK_KEY)) || []; } catch (e){ cfg.stocks = []; }
renderPicker();
renderPicked();
updateCount();
fitPreview();
drawIntro();
</script>
</body>
</html>
